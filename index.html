<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geni Studio — Dress Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 220px;
            padding: 15px;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Geni Studio — Dress Library</h1>
    <p>لائبریری کی پہلی تصویر</p>

    <div class="gallery" id="dress-gallery">
        <div class="card">
            <!-- یہاں تصویر کا نام آپ کی اپ لوڈ کردہ فائل کے نام کے ساتھ جوڑ دیا گیا ہے -->
            <img src="bcbf39e0-9055-4760-b5a4-b7fd703b716f.jpg" alt="Dress Image" onerror="this.src='https://via.placeholder.com/200x250?text=Image+Not+Found'">
            <h3>My Uploaded Dress</h3>
        </div>
    </div>

</body>
</html>
