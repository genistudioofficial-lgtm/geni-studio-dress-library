<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geni Studio — Dress Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 220px;
            padding: 15px;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Geni Studio — Dress Library</h1>
    <p>پاکستانی لباسوں کی لائیو لائبریری</p>

    <div class="gallery">
        <!-- زنانه لباس -->
        <div class="card">
            <img src="Femaledress.jpg" alt="Female Dress">
            <h3>Female Dress</h3>
        </div>

        <!-- مردانہ لباس -->
        <div class="card">
            <img src="Maledress.jpg" alt="Male Dress">
            <h3>Male Dress</h3>
        </div>
    </div>

</body>
</html>
